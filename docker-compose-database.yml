services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: db-mssql
    environment:
      SA_PASSWORD: "Ba705b8ta4428858eetadb8a"
      ACCEPT_EULA: "Y"
      MSSQL_TCP_PORT: 1433
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - salus-network
  
  mongo:
    image: mongo:latest
    container_name: db-mongo
    ports:
      - "27017:27017"  
    environment:
      MONGO_INITDB_ROOT_USERNAME: "salus"
      MONGO_INITDB_ROOT_PASSWORD: "Ba705b8ta4428858eetadb8a" 
    volumes:
      - mongo_data:/data/db 
    networks:
      - salus-network
    
  redis:
    image: redis:latest
    container_name: db-redis
    ports:
      - "6379:6379"
    networks:
      - salus-network

volumes:
  mssql-data:
  mongo_data:

networks:
  salus-network:
    driver: bridge